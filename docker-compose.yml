services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: liminal_test
      MARIADB_USER: liminal
      MARIADB_PASSWORD: liminal
    ports:
      # Remap with LIMINAL_DB_PORT when another MariaDB already holds 3306.
      - "${LIMINAL_DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
